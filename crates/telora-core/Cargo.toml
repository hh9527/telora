[package]
name = "telora-core"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
telora-data = { path = "../telora-data", features = ["serde"] }
codespan-reporting = "0.13"
logos = "0.16"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
