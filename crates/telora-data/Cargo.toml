[package]
name = "telora-data"
version = "0.1.0"
edition = "2024"
publish = false

[features]
serde = ["dep:serde"]

[dependencies]
codespan-reporting = { version = "0.13", default-features = false }
crop = { version = "0.4.3", default-features = false, features = ["simd", "utf16-metric"] }
logos = { version = "0.16", default-features = false, features = ["export_derive"] }
serde = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde_json = "1"
