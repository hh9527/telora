[package]
name = "telora-ees"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Extra Effect Service facade for Telora native actor components"

[dependencies]
anyhow = "1"
directories = "6"
imos = { path = "../imos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt", "sync"] }
