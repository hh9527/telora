[package]
name = "telora-run"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
wasmparser = "0.259"
wasmi = "2"
telora-wasm-shared = { path = "../telora-wasm-shared" }
