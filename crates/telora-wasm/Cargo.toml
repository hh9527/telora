[package]
name = "telora-wasm"
version.workspace = true
edition.workspace = true

[features]
snapshot = ["dep:wasmtime-wizer", "dep:futures-executor"]

[dependencies]
telora-data = { path = "../telora-data", features = ["serde"] }
telora-wasm-shared = { path = "../telora-wasm-shared" }
telora-core = { path = "../telora-core" }
wasm-encoder = "0.259"
wasmparser = "0.259"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = "2"
wasmtime-wizer = { version = "=49.0.0-rc.1", default-features = false, optional = true }
futures-executor = { version = "0.3", optional = true }
