[package]
name = "telora-wasm"
version.workspace = true
edition.workspace = true

[dependencies]
telora-data = { path = "../telora-data", features = ["serde"] }
telora-wasm-shared = { path = "../telora-wasm-shared" }
telora-core = { path = "../telora-core" }
wasm-encoder = { version = "0.259", features = ["wasmparser"] }
wasmparser = "0.259"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = "2"

[features]
default = []
experimental-mut-oracle = ["telora-core/experimental-mut-oracle"]
