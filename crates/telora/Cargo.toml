[package]
name = "telora"
version.workspace = true
edition.workspace = true

[[bin]]
name = "telora"
path = "src/main.rs"

[dependencies]
async-lsp = { version = "0.2.4", default-features = false, features = ["stdio", "tokio"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
telora-core = { path = "../telora-core" }
telora-wasm = { path = "../telora-wasm" }
telora-ees = { path = "../telora-ees" }
futures = "0.3"
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower-service = "0.3"
tempfile = "3"
