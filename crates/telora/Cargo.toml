[package]
name = "telora"
version.workspace = true
edition.workspace = true

[[bin]]
name = "telora"
path = "src/main.rs"

[dependencies]
async-lsp = { version = "0.2.4", default-features = false, features = ["stdio", "tokio"] }
clap = { version = "4", features = ["derive"] }
telora-core = { path = "../telora-core" }
telora-ees = { path = "../telora-ees" }
futures = "0.3"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower-service = "0.3"

[dev-dependencies]
flate2 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tar = "0.4"
tempfile = "3"
