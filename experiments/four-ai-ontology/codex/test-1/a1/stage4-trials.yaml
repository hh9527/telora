version: logistics-v1

trials:
  - id: direct
    class: legal-direct
    request: >-
      Create an analytics intent for the number of orders created, grouped by origin region and
      carrier name.
    expected: lowered

  - id: novel
    class: legal-novel
    request: >-
      Create an analytics intent for the number of product units shipped, grouped by product
      category and origin region.
    expected: lowered

  - id: unapproved
    class: unapproved-capability
    request: >-
      Create an analytics intent for the number of orders created, grouped by delivery exception.
    expected: model-rejected

  - id: mixed
    class: incompatible-grains
    request: >-
      Create one analytics intent for both the number of orders created and the number of
      delivered packages, grouped by origin region.
    expected: model-rejected

  - id: fanout
    class: fanout-only
    request: >-
      Create an analytics intent for the number of orders created, grouped by product category.
    expected: model-rejected

  - id: impossible
    class: unrepresentable
    request: >-
      Create an analytics intent for average delivery duration in hours, grouped by weather
      condition.
    expected: agent-refused
